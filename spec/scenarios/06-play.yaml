# Performance features on the Normal page.
- name: hold a key and press SPLIT to set the split point (note name shown)
  requires: engine              # the engine reports the held key (eng_lowest_held)
  steps:
    - key: {note: 48, hold: true}   # hw: the 8279 reports no key-up, so "hold SPLIT + key" cannot work; stock Rev4 way: hold the key, press SPLIT
    - press: kb_split
    - expect: {display: "SP  C3", state: {perf: {split: 48, kbMode: split}}, leds: {kb_split: "on"}}

- name: in split mode notes go to the left voices (4-7) or right voices (0-3)
  requires: engine
  steps:
    - press: kb_split           # hw: no "hold SPLIT + key" (no key-up events); the default split point is C4 (60)
    - key: {note: 40}
    - key: {note: 72}
    - expect: {voices: {4: 40, 0: 72}}

- name: autotune shows progress then oK
  requires: engine              # progress is drawn by tune_run (blocking)
  steps:
    - press: autotune
    - wait: 130
    - expect: {display: "tU12  ", leds: {autotune: blink}}
    - wait: 2000
    - expect: {display: "tU  oK"}

- name: TAPE DUMP now sends all programs as SysEx after confirmation
  steps:
    - press: tape_dump
    - expect: {display: "SEnd ?"}
    - press: store
    - expect: {display: "SEnt  ", midiOut: 9600}

- name: A440+OCT sets the arpeggiator octave range
  steps:
    - press: [a440, oct_l]
    - expect: {display: "Ao  L2", state: {perf: {arpOctL: 2}}}
