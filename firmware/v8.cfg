# NeoV8 memory map (Voyetra Eight Rev4 CPU card) - docs/hardware.md, src/api.inc
#   $0000-$00FF zero page   $0100 stack   $0200-$07FF BSS   $0800-$09FF fixed buffers (edit, perf, cal)
#   $0A00-$0DFF BSS2        $0E00-$0FFF fixed (call log, UI debug block, test port)   $1000-$1FFF BSS3
MEMORY {
    ZP:    start = $0002, size = $00FE, type = rw, define = yes;
    RAM:   start = $0200, size = $0600, type = rw, define = yes;
    RAM2:  start = $0A00, size = $0400, type = rw, define = yes;
    RAM3:  start = $1000, size = $1000, type = rw, define = yes;
    ROM:   start = $8000, size = $7FFA, type = ro, fill = yes, fillval = $FF, file = %O;
    VEC:   start = $FFFA, size = $0006, type = ro, fill = yes, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    BSS:      load = RAM,  type = bss, define = yes;
    BSS2:     load = RAM2, type = bss, define = yes, optional = yes;
    BSS3:     load = RAM3, type = bss, define = yes, optional = yes;
    PAGE:     load = ROM,  type = ro, align = $100, optional = yes;   # page-aligned tables (eng/env.asm), ROM start
    CODE:     load = ROM,  type = ro;
    RODATA:   load = ROM,  type = ro, optional = yes;
    VECTORS:  load = VEC,  type = ro;
}
