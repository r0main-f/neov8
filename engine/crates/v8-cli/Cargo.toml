[package]
name = "v8-cli"
description = "NeoV8 engine tools: trace (differential tests against the TypeScript emulator), render"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "v8-cli"
path = "src/main.rs"

[dependencies]
v8-machine = { path = "../v8-machine" }
v8-core = { path = "../v8-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
